<rect width="1200" height="860" fill="#f5f4ec"/>
<text x="38" y="43" class="title">撒网打鱼 · 界面与动作示意</text>
<text x="38" y="70" class="small">布局说明稿｜非最终美术｜分数、鱼群和收获均为演示</text>
